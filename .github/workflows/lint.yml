name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - name: Install
        run: |
          corepack enable
          pnpm i --frozen-lockfile
      - name: eslint
        run: |
          pnpm eslint
